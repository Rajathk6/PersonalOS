<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PersonalOS</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 12px; background: #111; color: #eee; }
  h1 { font-size: 1.3em; margin: 0 0 8px; }
  .card { background: #1c1c1c; border-radius: 10px; padding: 12px; margin-bottom: 10px; }
  .card h2 { font-size: 1em; margin: 0 0 8px; color: #9cf; }
  .row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 0.95em; }
  button { font-size: 1.05em; padding: 12px 18px; margin: 4px 8px 4px 0; border: 0; border-radius: 8px; }
  .approve { background: #2a7; color: #fff; }
  .deny { background: #a33; color: #fff; }
  .refresh { background: #357; color: #fff; width: 100%; }
  .dim { color: #888; font-size: 0.85em; }
  #tokenbox input { width: 70%; padding: 10px; font-size: 1em; }
  .card input, .card select { width: 100%; box-sizing: border-box; padding: 10px; font-size: 1em; margin-bottom: 8px; background: #222; color: #eee; border: 1px solid #444; border-radius: 8px; }
  .set { background: #2a7; color: #fff; width: 100%; }
  #remmsg { min-height: 1.4em; }
</style>
</head>
<body>
<h1>PersonalOS</h1>
<div id="tokenbox" class="card" style="display:none">
  <h2>API token</h2>
  <input id="token" type="password" placeholder="paste API token">
  <button class="approve" onclick="saveToken()">Save</button>
</div>
<div class="card"><h2>Status</h2><div id="health" class="dim">loading…</div></div>
<div class="card"><h2>Remind me</h2><div id="remform">  <input id="remtext" type="text" placeholder="e.g. leave for office">
  <input id="remat" type="datetime-local">
  <button class="set" onclick="setReminder()">Set reminder</button>
  <div id="remmsg" class="dim"></div>
</div></div>
<div class="card"><h2>Note it down</h2>
  <input id="notetext" type="text" placeholder="e.g. wifi password is ...">
  <button class="set" onclick="saveNote()">Save note</button>
  <div id="notemsg" class="dim"></div>
</div>
<div class="card"><h2>Spent money</h2>
  <input id="spendamt" type="number" min="1" step="any" placeholder="amount in ₹">
  <input id="spendnote" type="text" placeholder="what for?">
  <select id="spendacct"></select>
  <button class="set" onclick="saveSpend()">Record expense</button>
  <div id="spendmsg" class="dim"></div>
</div>
<div class="card"><h2>Ask it to do something</h2>
  <input id="goaltext" type="text" placeholder="e.g. remind me to call mom">
  <button class="set" onclick="askAI()">Do it</button>
  <div id="goalmsg" class="dim"></div>
</div>
<div class="card"><h2>Needs your approval <span id="acount"></span></h2><div id="approvals"></div></div>
<div class="card"><h2>Recent tasks</h2><div id="tasks"></div></div>
<div class="card"><h2>Money</h2><div id="money" class="dim">loading…</div></div>
<div><button class="refresh" onclick="load()">Refresh</button></div>
<script>
let token = localStorage.getItem("pos_token") || "";
if (!token) document.getElementById("tokenbox").style.display = "block";
function saveToken() {
  token = document.getElementById("token").value.trim();
  localStorage.setItem("pos_token", token);
  document.getElementById("tokenbox").style.display = "none";
  load();
}
async function api(path, opts) {
  const r = await fetch(path, { ...(opts || {}), headers: { "Authorization": "Bearer " + token, "Content-Type": "application/json", ...((opts && opts.headers) || {}) } });
  return r.json();
}
async function load() {
  try {
    const h = await api("/health");
    document.getElementById("health").textContent =
      `db ${h.db} · queue ${h.queue} · worker ${h.worker} · scheduler ${h.scheduler} · models ${(h.models || []).join(",")}`;
    const a = await api("/approvals?status=pending");
    document.getElementById("acount").textContent = `(${a.approvals.length})`;
    document.getElementById("approvals").innerHTML = a.approvals.length === 0
      ? '<span class="dim">nothing waiting</span>'
      : a.approvals.map(x =>
          `<div class="row"><span>${x.toolName}<br><span class="dim">${x.reason}</span></span>
           <span><button class="approve" onclick="resolve('${x.id}',true)">Yes</button><button class="deny" onclick="resolve('${x.id}',false)">No</button></span></div>`
        ).join("");
    const t = await api("/tasks?state=done");
    const q = await api("/tasks?state=queued");
    const rems = q.tasks
      .filter(x => x.type === "reminder.send")
      .map(x => `<div class="row"><span>⏰ ${(x.input && x.input.text) || x.type}<br><span class="dim">${new Date(x.notBefore).toLocaleString()}</span></span>
        <span><button class="deny" onclick="cancelReminder('${x.id}')">✕</button></span></div>`)
      .join("");
    document.getElementById("tasks").innerHTML =
      `<div class="row"><span>queued</span><b>${q.tasks.length}</b></div>` + rems +
      t.tasks.slice(0, 5).map(x => `<div class="row"><span>${x.type}</span><span class="dim">${x.state}</span></div>`).join("");
    const m = await api("/finance/summary");
    document.getElementById("money").textContent = `net ${m.netWorth} · spent ${m.monthSpend}`;
  } catch (e) {
    document.getElementById("health").textContent = "unreachable — start the API";
  }
}
async function resolve(id, ok) {
  try {
    await api(`/approvals/${id}/${ok ? "approve" : "deny"}`, { method: "POST", body: JSON.stringify({ by: "phone" }) });
  } catch (e) {
    document.getElementById("acount").textContent = "(tap failed — hit Refresh)";
  }
  load();
}
async function cancelReminder(id) {
  try {
    await api(`/tasks/${id}/cancel`, { method: "POST", body: "{}" });
  } catch (e) {
    // fall through to reload — the list shows the truth either way
  }
  load();
}
async function setReminder() {
  const msg = document.getElementById("remmsg");
  try {
    const text = document.getElementById("remtext").value.trim();
    const at = document.getElementById("remat").value;
    if (!text || !at) { msg.textContent = "type a reminder and pick a date + time"; return; }
    const when = new Date(at);
    if (isNaN(when.getTime()) || when.getTime() < Date.now()) { msg.textContent = "pick a future time"; return; }
    const r = await api("/tasks", { method: "POST", body: JSON.stringify({ type: "reminder.send", input: { text }, notBefore: when.toISOString() }) });
    if (r.error) { msg.textContent = "server said: " + (r.message || r.error); return; }
    msg.textContent = "set for " + when.toLocaleString();
    document.getElementById("remtext").value = "";
    load();
  } catch (e) {
    msg.textContent = "could not reach server — hit Refresh";
  }
}
async function saveNote() {
  const msg = document.getElementById("notemsg");
  try {
    const text = document.getElementById("notetext").value.trim();
    if (!text) { msg.textContent = "type something first"; return; }
    const r = await api("/memory", { method: "POST", body: JSON.stringify({ kind: "episodic", content: { text }, importance: 0.7 }) });
    if (r.error) { msg.textContent = "server said: " + (r.message || r.error); return; }
    msg.textContent = "noted ✓";
    document.getElementById("notetext").value = "";
  } catch (e) {
    msg.textContent = "could not reach server — hit Refresh";
  }
}
async function loadAccounts() {
  try {
    const r = await api("/finance/accounts");
    const sel = document.getElementById("spendacct");
    sel.innerHTML = (r.accounts || []).map(a => `<option>${a}</option>`).join("") || `<option value="">(no accounts yet)</option>`;
  } catch (e) { /* money card shows the error on submit */ }
}
async function saveSpend() {
  const msg = document.getElementById("spendmsg");
  try {
    const rupees = parseFloat(document.getElementById("spendamt").value);
    const note = document.getElementById("spendnote").value.trim();
    const account = document.getElementById("spendacct").value;
    if (!(rupees > 0) || !account) { msg.textContent = "enter an amount and pick an account"; return; }
    const paise = Math.round(rupees * 100);
    const r = await api("/finance/expenses", { method: "POST", body: JSON.stringify({ account, amountPaise: paise, note: note || undefined }) });
    if (!r.success) { msg.textContent = "server said: " + (r.message || r.error); return; }
    msg.textContent = r.message;
    document.getElementById("spendamt").value = "";
    document.getElementById("spendnote").value = "";
    load();
  } catch (e) {
    msg.textContent = "could not reach server — hit Refresh";
  }
}
async function askAI() {
  const msg = document.getElementById("goalmsg");
  try {
    const goal = document.getElementById("goaltext").value.trim();
    if (!goal) { msg.textContent = "tell it what to do first"; return; }
    msg.textContent = "thinking… (a minute or two on this laptop)";
    const r = await api("/agent/run", { method: "POST", body: JSON.stringify({ goal }) });
    if (r.error) { msg.textContent = "server said: " + (r.message || r.error); return; }
    const id = r.id;
    for (let i = 0; i < 60; i++) {
      await new Promise(rr => setTimeout(rr, 10000));
      const t = await api(`/tasks/${id}`);
      if (t.state === "done") {
        const kids = (t.output && t.output.childIds || []).length;
        msg.textContent = `done ✓ — made ${kids} task(s) (${(t.output && t.output.model) || "model"})`;
        load();
        return;
      }
      if (t.state === "failed" || t.state === "cancelled") { msg.textContent = "it failed — " + ((t.error && t.error.message) || t.state); return; }
      msg.textContent = `working… (${t.state})`;
    }
    msg.textContent = "still working — check Recent tasks";
  } catch (e) {
    msg.textContent = "could not reach server — hit Refresh";
  }
}
load().then(loadAccounts);
setInterval(load, 30000);
</script>
</body>
</html>
