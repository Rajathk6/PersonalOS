name: ci

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: personalos
          POSTGRES_PASSWORD: personalos
          POSTGRES_DB: personalos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U personalos -d personalos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://personalos:personalos@localhost:5432/personalos_test
      DATABASE_URL: postgresql://personalos:personalos@localhost:5432/personalos_test
      API_TOKEN: ci-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx prisma migrate deploy
      - run: npm test
