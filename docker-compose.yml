services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: personalos
      POSTGRES_PASSWORD: personalos
      POSTGRES_DB: personalos
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # PG_PORT lets a laptop that already runs Postgres (e.g. system PG on
      # 5432) host our container on another port. Default stays standard.
      - "${PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U personalos -d personalos"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
